<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biomes</title>
<style>
  :root { --night: #0e1630; --paper: #f5f7ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #1a2f28;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    color: var(--paper);
    -webkit-tap-highlight-color: transparent;
  }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; will-change: opacity; }
  .scene svg { width: 100%; height: 100%; display: block; }

  .captions {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 1.25rem);
    padding: 0 3.25rem 0 1rem;
    display: grid;
    pointer-events: none;
  }
  .cap {
    grid-area: 1 / 1;
    align-self: end;
    width: 100%;
    max-width: 30rem;
    margin: 0 auto;
    padding: 1rem 1.15rem 1.1rem;
    background: rgba(14, 22, 48, .66);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    opacity: 0;
  }
  .cap h2 { margin: 0 0 .35rem; font-size: 1.7rem; line-height: 1.15; }
  .cap p { margin: 0; font-size: 1rem; line-height: 1.5; }

  .dots {
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 2px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
  }
  .dots button {
    width: 36px; height: 36px;
    background: none; border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
  }
  .dots button::after {
    content: "";
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,.5);
    border: 2px solid rgba(14,22,48,.6);
    transition: transform .2s, background .2s;
  }
  .dots button[aria-current="true"]::after { background: #fff; transform: scale(1.35); }
  .dots button:focus-visible { outline: 2px solid #fff; border-radius: 8px; }

  .hint {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 1.1rem);
    left: 0; right: 0;
    text-align: center;
    margin: 0;
    font-style: italic;
    font-size: 1.15rem;
    text-shadow: 0 1px 6px rgba(14,22,48,.7);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="stage" id="stage" aria-hidden="true"></div>
  <p class="hint" id="hint">Scroll down</p>
  <div class="captions" id="captions"></div>
  <nav class="dots" id="dots" aria-label="Biomes"></nav>
  <div id="spacer"></div>

<script>
/* ---------- helpers ---------- */
const X0 = -900, X1 = 1300;               // scenes are drawn wide so wide screens stay filled
const f = n => n.toFixed(1);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const poly = pts => "M" + pts.map(p => f(p[0]) + "," + f(p[1])).join("L") + "Z";
const ground = pts => poly([[X0, 900], ...pts, [X1, 900]]);
const line = pts => "M" + pts.map(p => f(p[0]) + "," + f(p[1])).join("L");
function jag(r, step, base, amp) {         // jagged ridge: even points are peaks
  const pts = []; let i = 0;
  for (let x = X0; x <= X1; x += step, i++) {
    const peak = i % 2 === 0;
    pts.push([x + (r() - .5) * step * .4, peak ? base - amp * (.5 + .5 * r()) : base - amp * .15 * r()]);
  }
  return pts;
}
function hills(base, amp, fq, ph, step = 12) {
  const pts = [];
  for (let x = X0; x <= X1; x += step)
    pts.push([x, base + Math.sin(x * fq + ph) * amp + Math.sin(x * fq * 2.3 + ph * 1.7) * amp * .4]);
  return pts;
}
function yAt(pts, x) {
  for (let i = 1; i < pts.length; i++) {
    if (pts[i][0] >= x) {
      const a = pts[i - 1], b = pts[i], t = (x - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * t;
    }
  }
  return pts[pts.length - 1][1];
}
function caps(pts, maxY) {                 // snow caps on the peaks of a jag() ridge
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  let d = "";
  for (let i = 2; i < pts.length - 1; i += 2) {
    const P = pts[i], L = pts[i - 1], R = pts[i + 1];
    if (P[1] > maxY) continue;
    const a = lerp(P, L, .33), b = lerp(P, R, .33);
    const m1 = lerp(a, b, .3), m2 = lerp(a, b, .55), m3 = lerp(a, b, .8);
    d += poly([P, a, [m1[0], m1[1] + 10], [m2[0], m2[1] + 2], [m3[0], m3[1] + 11], b]);
  }
  return d;
}
function pine(x, y, h) {
  const w = h * .28;
  return poly([[x, y - h], [x - w * .5, y - h * .55], [x + w * .5, y - h * .55]]) +
         poly([[x, y - h * .8], [x - w * .75, y - h * .25], [x + w * .75, y - h * .25]]) +
         poly([[x, y - h * .5], [x - w, y], [x + w, y]]);
}
function waveP(base, amp, wl, ph) {
  const pts = [];
  for (let x = X0; x <= X1; x += 10) pts.push([x, base + Math.sin(x / wl * 6.283 + ph) * amp]);
  return pts;
}
function canopy(r, base, r0, r1, fill) {
  let s = "";
  for (let x = X0; x < X1; x += r0 * .8)
    s += `<circle cx="${f(x)}" cy="${f(base + r() * 24)}" r="${f(r0 + r() * (r1 - r0))}"/>`;
  return `<g fill="${fill}">${s}<rect x="${X0}" y="${base + 10}" width="${X1 - X0}" height="${900 - base - 10}"/></g>`;
}
const glow = i => `<radialGradient id="glow${i}"><stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>`;

/* ---------- biomes ---------- */
function mountains() {
  const r = rng(11);
  const far = jag(r, 80, 470, 120), mid = jag(r, 110, 610, 270);
  const near = hills(700, 24, .011, 1.2), front = hills(800, 14, .02, 3);
  let pn = "", pf = "";
  for (let x = X0; x < X1; x += 16 + r() * 18) pn += pine(x, yAt(near, x) + 4, 36 + r() * 28);
  for (let x = X0 + 30; x < X1; x += 70 + r() * 90) pf += pine(x, yAt(front, x) + 4, 90 + r() * 40);
  return {
    name: "Mountains",
    text: "Thin air, bare rock, and snow that lingers into summer. Meltwater from up here runs downhill toward the sea.",
    sky: [[0, "#6f9bd6"], [.6, "#c6d8ee"], [1, "#f6dcc2"]],
    defs: glow(0),
    layers: [
      [.1, `<circle cx="285" cy="250" r="90" fill="url(#glow0)"/><circle cx="285" cy="250" r="30" fill="#fff3d6"/>`],
      [.3, `<path d="${ground(far)}" fill="#a3b5d6"/>`],
      [.6, `<path d="${ground(mid)}" fill="#60769f"/><path d="${caps(mid, 500)}" fill="#f1f5ff"/>`],
      [1, `<path d="${ground(near)}" fill="#37594c"/><path d="${pn}" fill="#254439"/>`],
      [1.5, `<path d="${ground(front)}" fill="#1a2f28"/><path d="${pf}" fill="#12231e"/>`]
    ]
  };
}

function ocean() {
  const r = rng(23);
  let clouds = "";
  for (let k = 0; k < 9; k++) {
    const cx = -600 + k * 200 + r() * 80, cy = 110 + r() * 170;
    clouds += `<g fill="#fff" opacity="${(.55 + r() * .25).toFixed(2)}"><ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(70 + r() * 40)}" ry="${f(12 + r() * 6)}"/><ellipse cx="${f(cx + 30)}" cy="${f(cy - 9)}" rx="40" ry="12"/></g>`;
  }
  const cols = ["#2a9fba", "#2189ab", "#1a7298", "#135b84", "#0d466f", "#08355c"];
  const layers = [
    [.1, `<circle cx="200" cy="430" r="120" fill="url(#glow1)"/><circle cx="200" cy="430" r="36" fill="#fff2cf"/>`],
    [.2, clouds],
    [.2, `<rect x="${X0}" y="430" width="${X1 - X0}" height="470" fill="#7fcad3"/>`]
  ];
  for (let l = 0; l < 6; l++) {
    const pts = waveP(455 + l * 62, 2.5 + l * 2.6, 70 + l * 45, r() * 6);
    layers.push([.3 + l * .22, `<path d="${ground(pts)}" fill="${cols[l]}"/><path d="${line(pts)}" fill="none" stroke="#e9fbff" stroke-opacity=".35" stroke-width="1.6"/>`]);
    if (l === 0) {
      layers.push([.35, `<path d="M108,452L154,452L145,463L118,463Z" fill="#f2ede2"/><path d="M131,451L131,408L112,451Z" fill="#fff"/><path d="M135,451L135,418L152,451Z" fill="#e6ebf5"/><path d="M131,408L131,451" stroke="#8a7a66" stroke-width="1.5"/>`]);
    }
  }
  let glit = "";
  for (let k = 0; k < 12; k++)
    glit += `<ellipse cx="${f(200 + (r() - .5) * 12)}" cy="${f(442 + k * 26)}" rx="${f(10 + k * 5)}" ry="2.2" opacity="${Math.max(.08, .55 - k * .04).toFixed(2)}"/>`;
  layers.push([.5, `<g fill="#fff4d6">${glit}</g>`]);
  return {
    name: "Ocean",
    text: "Water covers about 71% of Earth's surface, and most of it is ocean. Currents carry heat around the planet.",
    sky: [[0, "#3f93bd"], [.55, "#9fd3df"], [1, "#f6e3c3"]],
    defs: glow(1),
    layers
  };
}

function desert() {
  const r = rng(31);
  const d0 = hills(575, 8, .015, 0), d1 = hills(630, 30, .008, .6), d2 = hills(705, 38, .007, 2.1), d3 = hills(785, 30, .009, 4);
  let mesas = "";
  for (let x = X0, k = 0; x < X1; k++) {
    const w = 80 + r() * 140, h = 50 + r() * 70;
    mesas += `<path d="${poly([[x, 900], [x, 560], [x + w * .12, 560 - h], [x + w * .88, 560 - h], [x + w, 560], [x + w, 900]])}" fill="${k % 2 ? "#d98960" : "#cf7650"}"/>`;
    x += w + 60 + r() * 200;
  }
  const cactus = (x, y, s) => `<g stroke="#3a6a45" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M${x},${y}L${x},${y - 90 * s}" stroke-width="${14 * s}"/><path d="M${x},${y - 30 * s}h${-22 * s}v${-26 * s}" stroke-width="${9 * s}"/><path d="M${x},${y - 45 * s}h${22 * s}v${-30 * s}" stroke-width="${9 * s}"/></g>`;
  return {
    name: "Desert",
    text: "Deserts get under 250 mm (10 in) of rain a year. Many swing from scorching days to freezing nights.",
    sky: [[0, "#e97d58"], [.5, "#f6b778"], [1, "#fde6b4"]],
    defs: glow(2),
    layers: [
      [.1, `<circle cx="290" cy="300" r="150" fill="url(#glow2)"/><circle cx="290" cy="300" r="56" fill="#fff2c2"/>`],
      [.25, mesas],
      [.35, `<path d="${ground(d0)}" fill="#e3a06d"/>`],
      [.6, `<path d="${ground(d1)}" fill="#e8b36d"/>`],
      [.9, `<path d="${ground(d2)}" fill="#d99a52"/>`],
      [1.3, `<path d="${ground(d3)}" fill="#c47f3c"/>${cactus(95, 800, 1)}${cactus(330, 810, .7)}${cactus(640, 805, .9)}${cactus(-260, 805, .85)}`]
    ]
  };
}

function rainforest() {
  const r = rng(47);
  let trunks = "", vines = "", rays = "", leaves = "";
  for (let x = X0; x < X1; x += 90 + r() * 120) {
    const w = 8 + r() * 10;
    trunks += `<rect x="${f(x)}" y="-60" width="${f(w)}" height="1000" fill="#33261c"/><rect x="${f(x + w * .2)}" y="-60" width="${f(w * .22)}" height="1000" fill="#5a4330" opacity=".6"/>`;
  }
  for (let x = X0; x < X1; x += 110 + r() * 150)
    vines += `<path d="M${f(x)},-60C${f(x + 30)},60 ${f(x - 30)},200 ${f(x + 10)},${f(250 + r() * 150)}" stroke="#2c6b3f" stroke-width="3" fill="none"/>`;
  for (let x = X0; x < X1; x += 230)
    rays += poly([[x, -100], [x + 60, -100], [x + 260, 900], [x + 140, 900]]);
  for (let x = X0; x < X1; x += 130) {
    const cy = 790 + r() * 100, a = -50 + r() * 100;
    leaves += `<ellipse cx="${f(x)}" cy="${f(cy)}" rx="${f(70 + r() * 30)}" ry="18" transform="rotate(${f(a)} ${f(x)} ${f(cy)})"/>`;
  }
  const ground1 = hills(815, 10, .02, 2);
  return {
    name: "Rainforest",
    text: "Warm, wet, and crowded with life. Tropical rainforests hold a large share of the world's land species.",
    sky: [[0, "#bfe0cb"], [1, "#6fae86"]],
    defs: "",
    layers: [
      [.2, `<g fill="#fff" opacity=".1"><path d="${rays}"/></g>`],
      [.3, canopy(r, 520, 34, 58, "#8fc09a")],
      [.55, canopy(r, 600, 44, 70, "#4f9363")],
      [.75, trunks],
      [.95, canopy(r, 710, 54, 92, "#2f6f48")],
      [1.2, `<path d="${ground(ground1)}" fill="#1f4a33"/>${vines}`],
      [1.5, `<g fill="#1b4a2f">${leaves}</g>`]
    ]
  };
}

function tundra() {
  const r = rng(59);
  let stars = "", snow = "", spruce = "";
  for (let k = 0; k < 110; k++)
    stars += `<circle cx="${f(X0 + r() * (X1 - X0))}" cy="${f(r() * 430)}" r="${f(.6 + r() * .8)}" opacity="${(.5 + r() * .5).toFixed(2)}"/>`;
  const band = (top, ph) => {
    const t = [], b = [];
    for (let x = X0; x <= X1; x += 30) {
      t.push([x, top + Math.sin(x * .012 + ph) * 30 + Math.sin(x * .031 + ph * 2) * 12]);
      b.push([x, top + 150 + Math.sin(x * .01 + ph + 1) * 25]);
    }
    return poly([...t, ...b.reverse()]);
  };
  const ridge1 = jag(r, 90, 570, 80), ridge2 = jag(r, 120, 620, 60);
  const g1 = hills(650, 16, .01, 1), g2 = hills(745, 14, .014, 3), g3 = hills(825, 10, .02, 5);
  for (let x = X0; x < X1; x += 60 + r() * 120) spruce += pine(x, yAt(g1, x) + 3, 22 + r() * 18);
  for (let k = 0; k < 90; k++)
    snow += `<circle cx="${f(X0 + r() * (X1 - X0))}" cy="${f(60 + r() * 740)}" r="${f(.8 + r() * 1.3)}" opacity="${(.4 + r() * .4).toFixed(2)}"/>`;
  return {
    name: "Tundra",
    text: "Below the thin surface, the ground stays frozen. Few trees grow here, but plants and animals have adapted to the cold.",
    sky: [[0, "#101a47"], [.55, "#3b4f93"], [1, "#9db4dc"]],
    defs: `<linearGradient id="aur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62ffc0" stop-opacity="0"/><stop offset=".4" stop-color="#62ffc0" stop-opacity=".55"/><stop offset="1" stop-color="#8a7bff" stop-opacity="0"/></linearGradient><filter id="soft" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>`,
    layers: [
      [.05, `<g fill="#fff">${stars}</g>`],
      [.15, `<g filter="url(#soft)" fill="url(#aur)"><path d="${band(170, 0)}"/><path d="${band(240, 2.4)}" opacity=".6"/></g>`],
      [.3, `<path d="${ground(ridge1)}" fill="#b6c6e6"/>`],
      [.5, `<path d="${ground(ridge2)}" fill="#9fb2d6"/>`],
      [.7, `<path d="${ground(g1)}" fill="#dfe8f7"/><path d="${spruce}" fill="#35496b"/><ellipse cx="230" cy="700" rx="150" ry="16" fill="#a9cfe6"/>`],
      [1, `<path d="${ground(g2)}" fill="#eef3fc"/>`],
      [1.3, `<path d="${ground(g3)}" fill="#fafcff"/>`],
      [1.6, `<g fill="#fff">${snow}</g>`]
    ]
  };
}

/* ---------- build ---------- */
const scenes = [mountains(), ocean(), desert(), rainforest(), tundra()];
const N = scenes.length;
const stage = document.getElementById("stage");
const capsEl = document.getElementById("captions");
const dotsEl = document.getElementById("dots");
const hint = document.getElementById("hint");
const spacer = document.getElementById("spacer");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const sceneEls = [], layerEls = [], capEls = [], dotEls = [], svgs = [];
scenes.forEach((s, i) => {
  const div = document.createElement("div");
  div.className = "scene";
  const stops = s.sky.map(p => `<stop offset="${p[0]}" stop-color="${p[1]}"/>`).join("");
  div.innerHTML =
    `<svg preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sky${i}" x1="0" y1="0" x2="0" y2="1">${stops}</linearGradient>${s.defs}</defs>` +
    `<rect x="-1200" y="-100" width="2800" height="1000" fill="url(#sky${i})"/>` +
    s.layers.map(l => `<g class="layer" data-depth="${l[0]}">${l[1]}</g>`).join("") + `</svg>`;
  stage.appendChild(div);
  sceneEls.push(div);
  svgs.push(div.querySelector("svg"));
  layerEls.push([...div.querySelectorAll(".layer")].map(g => ({ g, depth: +g.dataset.depth })));

  const cap = document.createElement("div");
  cap.className = "cap";
  cap.innerHTML = `<h2>${s.name}</h2><p>${s.text}</p>`;
  capsEl.appendChild(cap);
  capEls.push(cap);

  const b = document.createElement("button");
  b.setAttribute("aria-label", s.name);
  b.addEventListener("click", () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    scrollTo({ top: max * i / (N - 1), behavior: reduce ? "auto" : "smooth" });
  });
  dotsEl.appendChild(b);
  dotEls.push(b);
});

function setView() {
  const vbW = Math.max(400, 800 * innerWidth / innerHeight);
  svgs.forEach(s => s.setAttribute("viewBox", `${f(200 - vbW / 2)} 0 ${f(vbW)} 800`));
  spacer.style.height = (N * innerHeight) + "px";
}

let ticking = false;
function update() {
  ticking = false;
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const p = clamp(scrollY / max * (N - 1), 0, N - 1);
  sceneEls.forEach((el, i) => {
    const o = i === 0 ? 1 : clamp(p - (i - 1), 0, 1);
    el.style.opacity = o;
    el.style.visibility = (o === 0 || (i < N - 1 && p >= i + 1)) ? "hidden" : "visible";
    if (!reduce) {
      const d = clamp(p - i, -1, 1);
      layerEls[i].forEach(l => { l.g.style.transform = `translateY(${(-d * l.depth * 30).toFixed(1)}px)`; });
    }
    const co = clamp(1 - Math.abs(p - i) * 2.4, 0, 1);
    capEls[i].style.opacity = co;
    capEls[i].style.transform = `translateY(${((p - i) * -24).toFixed(1)}px)`;
    dotEls[i].setAttribute("aria-current", Math.round(p) === i ? "true" : "false");
  });
  hint.style.opacity = clamp(1 - scrollY / 80, 0, 1);
}
function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }

addEventListener("scroll", onScroll, { passive: true });
addEventListener("resize", () => { setView(); update(); });
setView();
update();
</script>
</body>
</html>
